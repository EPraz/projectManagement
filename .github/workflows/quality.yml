name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Lint without modifying source
        run: npm run lint
      - name: Run retained frontend tests
        run: npm test -- --runInBand
      - name: Build production assets
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: quality_ci_only
          POSTGRES_DB: project_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality -d project_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://quality:quality_ci_only@127.0.0.1:5432/project_management_test?schema=public
      TEST_DATABASE_URL: postgresql://quality:quality_ci_only@127.0.0.1:5432/project_management_test?schema=public
      JWT_SECRET: isolated-ci-demo-secret-at-least-32-characters
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npx --no-install prisma validate
      - name: Check types
        run: npm run typecheck
      - name: Lint without modifying source
        run: npm run lint
      - name: Build the API
        run: npm run build
      - name: Run guarded HTTP and seed tests with ephemeral PostgreSQL
        run: npm test
